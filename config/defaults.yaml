---
common:
  timezone: "Asia/Dubai"
  locale: "en_US.UTF-8"
  base_packages:
    - curl
    - git
    - unzip
    - ca-certificates

dotfiles:
  enabled: true
  local_path: "/home/wardn/dev/made_after_dark/dotfiles"
  repo_url: "https://github.com/guilyx/dotfiles.git"
  destination: "~/.dotfiles"
  auto_discover_stow_folders: true
  exclude_stow_folders:
    - ".git"
    - "ansible"
  stow_folders:
    - zsh
    - starship
    - fzf
    - fd
    - ripgrep
    - bat
    - tmux
    - git
    - quality
    - pyright
    - ruff
    - black
    - shellcheck
    - shfmt
    - yamllint
    - ansible
    - polybar
    - picom
    - rofi
    - feh
    - dunst
    - waybar
    - docker
    - lazydocker
    - k9s
    - direnv
    - gitleaks

dev:
  enabled: true
  package_manager: "apt"
  packages:
    - build-essential
    - make
    - jq
    - ripgrep
    - fd-find
    - tmux
    - fzf
    - zoxide
    - bat
    - direnv
  python:
    enabled: true
    packages:
      - pipx
      - virtualenv
      - pre-commit
  node:
    enabled: true
    packages:
      - nodejs
      - npm
  shell:
    enabled: true
    user: ""
    packages:
      - zsh
    oh_my_zsh:
      enabled: true
      repo_url: "https://github.com/ohmyzsh/ohmyzsh.git"
      branch: "master"
      plugins:
        - git
        - docker
        - docker-compose
        - npm
        - python
        - ubuntu
      theme: "robbyrussell"
  git:
    enabled: true
    packages:
      - git-lfs
      - gh
  quality:
    enabled: true
    packages:
      - shellcheck
      - yamllint
  containers:
    enabled: true
    packages:
      - docker.io
      - docker-compose-v2
  desktop:
    enabled: true
    packages:
      - polybar
      - rofi
      - picom
      - feh
      - dunst
      - waybar
  docs_and_reviews:
    enabled: true

vps:
  enabled: true
  create_deploy_user: true
  deploy_user: "deploy"
  disable_password_auth: true
  ssh_port: 22
  ufw:
    enabled: true
    allow:
      - "OpenSSH"
      - "80"
      - "443"
  reverse_proxy:
    engine: "caddy"
    domains:
      - domain: "example.com"
        upstream: "127.0.0.1:3000"
