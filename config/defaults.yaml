---
common:
  timezone: "Asia/Dubai"
  locale: "en_US.UTF-8"
  base_packages:
    - curl
    - wget
    - git
    - unzip
    - zip
    - ca-certificates
    - gnupg
    - software-properties-common
    - apt-transport-https

# Dotfiles are managed by chezmoi by default.
# Set `manager: stow` to fall back to the GNU stow workflow.
dotfiles:
  enabled: true
  manager: "chezmoi"
  local_path: ""
  repo_url: "https://github.com/guilyx/dotfiles.git"
  destination: "~/.dotfiles"
  auto_discover_stow_folders: true
  exclude_stow_folders:
    - ".git"
    - "ansible"
  stow_folders:
    - zsh
    - starship
    - fzf
    - tmux
    - git
    - direnv

chezmoi:
  enabled: true
  user: ""
  repo_url: "https://github.com/guilyx/chezmoi.git"
  install_dir: "/usr/local/bin"
  apply: true
  update: true
  # Values exposed to chezmoi templates via ~/.config/chezmoi/chezmoi.toml.
  data:
    name: "Erwin Lejeune"
    email: "erwin.lejeune15@gmail.com"
    editor: "nvim"
    signing_key: ""
    work_machine: false

dev:
  enabled: true
  package_manager: "apt"
  packages:
    - build-essential
    - make
    - cmake
    - pkg-config
    - jq
    - yq
    - ripgrep
    - fd-find
    - tmux
    - fzf
    - zoxide
    - bat
    - eza
    - htop
    - btop
    - tree
    - ncdu
    - duf
    - httpie
    - net-tools
    - dnsutils
    - rsync
    - tldr
    - neofetch
    - direnv
    - xclip
    - unzip
    # Needed by the app ecosystem: ffmpeg for clankergram's reel processing,
    # sqlite3 for LeClanker's memory store.
    - ffmpeg
    - sqlite3
    - openssl
  python:
    enabled: true
    packages:
      - python3
      - python3-pip
      - python3-venv
      - pipx
      - virtualenv
      - pre-commit
  node:
    enabled: true
    # From NodeSource, not apt: Ubuntu ships Node 18 and the ecosystem apps
    # need >= 22.
    version_major: 22
    enable_corepack: true
    global_packages: []
  ai_tools:
    enabled: true
    claude_code:
      enabled: true
    cursor:
      enabled: true
      download_url: "https://downloader.cursor.sh/linux/appImage/x64"
      install_dir: "/opt/cursor"
      desktop_entry: true
  rust:
    enabled: true
    # Installed through rustup so toolchains stay user-owned and updatable.
    channel: "stable"
    components:
      - rustfmt
      - clippy
  go:
    enabled: false
    packages:
      - golang-go
  shell:
    enabled: true
    user: ""
    packages:
      - zsh
      - fonts-powerline
    oh_my_zsh:
      enabled: true
      repo_url: "https://github.com/ohmyzsh/ohmyzsh.git"
      branch: "master"
      plugins:
        - git
        - docker
        - docker-compose
        - npm
        - python
        - ubuntu
        - direnv
        - fzf
        - zoxide
      theme: "robbyrussell"
      custom_plugins:
        - name: "zsh-autosuggestions"
          repo_url: "https://github.com/zsh-users/zsh-autosuggestions.git"
        - name: "zsh-syntax-highlighting"
          repo_url: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
        - name: "zsh-completions"
          repo_url: "https://github.com/zsh-users/zsh-completions.git"
    starship:
      enabled: true
  git:
    enabled: true
    packages:
      - git-lfs
      - gh
      - tig
    # Global git ergonomics applied to the target user.
    configure_global: true
    user_name: ""
    user_email: ""
    default_branch: "main"
    pull_rebase: true
    editor: "nvim"
  editor:
    enabled: true
    packages:
      - neovim
    default: "nvim"
  quality:
    enabled: true
    packages:
      - shellcheck
      - shfmt
      - yamllint
  containers:
    enabled: true
    packages:
      - docker.io
      - docker-compose-v2
    # Adds the target user to the docker group so `sudo` is not needed.
    add_user_to_docker_group: true
  desktop:
    enabled: false
    packages:
      - polybar
      - rofi
      - picom
      - feh
      - dunst
      - waybar
  docs_and_reviews:
    enabled: true

# Optional hand-off to the app ecosystem defined in the chezmoi repo. Off by
# default: bringing the stacks up needs secrets that only you can supply.
apps:
  enabled: false
  repo_url: "https://github.com/guilyx/chezmoi.git"
  destination: "~/apps/chezmoi"
  version: "main"
  update: true
  run_bootstrap: false
  start_stacks: false

# Optional local LLM serving harness (vLLM on GPU rigs, Ollama on Jetson/CPU;
# one OpenAI-compatible gateway URL either way). Off by default: serving pulls
# multi-GB model weights. The role clones the repo and calls its own scripts.
leharness:
  enabled: false
  repo_url: "https://github.com/guilyx/LeHarness.git"
  destination: "~/apps/LeHarness"
  version: "main"
  update: true
  # Wire the NVIDIA container toolkit into docker when a GPU is present but
  # the runtime is missing (no-op on GPU-less machines).
  install_gpu_runtime: true
  # Start serving during provisioning (downloads model weights immediately).
  start: false

vps:
  enabled: true
  create_deploy_user: true
  deploy_user: "deploy"
  disable_password_auth: true
  ssh_port: 22
  ssh_authorized_keys: []
  ufw:
    enabled: true
    allow:
      - "OpenSSH"
      - "80"
      - "443"
  reverse_proxy:
    engine: "caddy"
    domains:
      - domain: "example.com"
        upstream: "127.0.0.1:3000"
