[project]
name = "setup-orchestrator"
version = "0.1.0"
description = "Configurable dev and VPS setup orchestration"
requires-python = ">=3.11"
dependencies = [
  "Flask",
  "PyYAML",
  "ansible-core>=2.16",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo is run in place rather than installed, so tests import from the
# working tree.
pythonpath = ["."]
