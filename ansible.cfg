[defaults]
inventory = ./inventory/vps.example.ini
roles_path = ./roles
# Repo-local so collections resolve identically whether the playbook runs as
# your user or under sudo (where HOME becomes /root).
collections_path = ./.ansible/collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
