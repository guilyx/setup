---
# Ubuntu ships an old Node (18 on 24.04) and packages npm separately, which
# conflicts with NodeSource's nodejs (it bundles its own npm). The ecosystem
# apps need >= 22, so install from NodeSource and let it own npm.
- name: Detect the installed Node major version
  ansible.builtin.command:
    cmd: node -p process.versions.node.split(".")[0]
  register: node_installed_major
  changed_when: false
  failed_when: false

- name: Install Node from NodeSource
  when: >-
    node_installed_major.rc != 0
    or (node_installed_major.stdout | trim | int) < (dev.node.version_major | int)
  block:
    - name: Ensure the apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add the NodeSource signing key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"

    - name: Add the NodeSource repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/nodesource.asc]
          https://deb.nodesource.com/node_{{ dev.node.version_major }}.x nodistro main
        filename: nodesource
        state: present

    - name: Remove the distro npm package
      ansible.builtin.package:
        name: npm
        state: absent

    - name: Install Node
      ansible.builtin.package:
        name: nodejs
        state: present

- name: Enable corepack for pnpm and yarn
  ansible.builtin.command:
    cmd: corepack enable
  register: corepack_result
  changed_when: corepack_result.rc == 0
  failed_when: false
  when: dev.node.enable_corepack | default(true) | bool

- name: Install global npm packages
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  loop: "{{ dev.node.global_packages | default([]) }}"
